<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Mode — ICU Wiki Research</title>
    <meta name="description" content="Minimal voice-mode ICU Wiki chatbot window." />
    <link rel="stylesheet" href="/icu-wiki/assets/site.css?v=20260610193820" />
  </head>
  <body class="voice-minimal-page">
    <main class="voice-minimal-shell">
      <div class="voice-console" id="voice-console" data-api-url="https://blackwell.tail740bf8.ts.net/api/voice/ask" data-status-url="https://blackwell.tail740bf8.ts.net/api/voice/status" data-mode="single">
        <button type="button" class="voice-orb" data-role="orb" data-state="idle" aria-label="Start or stop voice question">
          <span data-role="label">Tap me to start</span>
        </button>
        <div hidden data-role="audio"></div>
      </div>
    </main>

    <script>
    (() => {
      const root = document.getElementById("voice-console");
      if (!root) return;

      const orb = root.querySelector("[data-role='orb']");
      const label = root.querySelector("[data-role='label']");
      const audioSlot = root.querySelector("[data-role='audio']");
      const apiUrl = root.dataset.apiUrl;
      const statusUrl = root.dataset.statusUrl;
      const answerMode = root.dataset.mode || "single";

      let audioContext = null;
      let source = null;
      let processor = null;
      let stream = null;
      let chunks = [];
      let recording = false;
      let sessionId = 0;
      let state = "idle";
      let abortController = null;
      let activeAudio = null;
      let stageTimer = null;

      function setState(nextState, text) {
        state = nextState;
        orb.dataset.state = nextState;
        label.textContent = text;
      }

      function requestJson(url, options = {}) {
        if (typeof fetch === "function") {
          return fetch(url, options);
        }
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open(options.method || "GET", url);
          Object.entries(options.headers || {}).forEach(([key, value]) => xhr.setRequestHeader(key, value));
          xhr.onload = () => {
            let parsed = {};
            try {
              parsed = xhr.responseText ? JSON.parse(xhr.responseText) : {};
            } catch (error) {
              reject(error);
              return;
            }
            resolve({
              ok: xhr.status >= 200 && xhr.status < 300,
              status: xhr.status,
              json: () => Promise.resolve(parsed),
            });
          };
          xhr.onerror = () => reject(new Error("Network request failed."));
          xhr.send(options.body || null);
        });
      }

      function clearStageTimer() {
        if (stageTimer) window.clearTimeout(stageTimer);
        stageTimer = null;
      }

      function stopPlayback() {
        if (activeAudio) {
          activeAudio.pause();
          activeAudio.removeAttribute("src");
          activeAudio.load();
          activeAudio = null;
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        audioSlot.innerHTML = "";
      }

      function stopRecordingHardware() {
        recording = false;
        processor?.disconnect();
        source?.disconnect();
        stream?.getTracks().forEach((track) => track.stop());
        processor = null;
        source = null;
        stream = null;
      }

      function resetCurrentSession() {
        sessionId += 1;
        clearStageTimer();
        abortController?.abort();
        abortController = null;
        stopRecordingHardware();
        audioContext?.close();
        audioContext = null;
        stopPlayback();
      }

      function flattenChunks() {
        const totalLength = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
        const merged = new Float32Array(totalLength);
        let offset = 0;
        chunks.forEach((chunk) => {
          merged.set(chunk, offset);
          offset += chunk.length;
        });
        return merged;
      }

      function resampleLinear(input, sourceRate, targetRate) {
        if (sourceRate === targetRate) return input;
        const ratio = sourceRate / targetRate;
        const outputLength = Math.max(1, Math.round(input.length / ratio));
        const output = new Float32Array(outputLength);
        for (let i = 0; i < outputLength; i += 1) {
          const sourceIndex = i * ratio;
          const left = Math.floor(sourceIndex);
          const right = Math.min(left + 1, input.length - 1);
          const weight = sourceIndex - left;
          output[i] = input[left] * (1 - weight) + input[right] * weight;
        }
        return output;
      }

      function encodeWav(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeString = (offset, value) => {
          for (let i = 0; i < value.length; i += 1) view.setUint8(offset + i, value.charCodeAt(i));
        };
        writeString(0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        writeString(8, "WAVE");
        writeString(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, "data");
        view.setUint32(40, samples.length * 2, true);
        let offset = 44;
        for (let i = 0; i < samples.length; i += 1, offset += 2) {
          const clipped = Math.max(-1, Math.min(1, samples[i]));
          view.setInt16(offset, clipped < 0 ? clipped * 0x8000 : clipped * 0x7fff, true);
        }
        return new Blob([view], { type: "audio/wav" });
      }

      async function blobToBase64(blob) {
        const buffer = await blob.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        let binary = "";
        for (let i = 0; i < bytes.length; i += 0x8000) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(binary);
      }

      function browserSpeak(text) {
        if (!("speechSynthesis" in window) || !text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/\[[0-9,\s]+\]/g, ""));
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }

      function playAnswer(payload, currentSession) {
        if (currentSession !== sessionId) return;
        setState("answering", "Answering");
        const audio = payload.audio || {};
        if (audio.base64 && audio.mime_type) {
          activeAudio = new Audio(`data:${audio.mime_type};base64,${audio.base64}`);
          activeAudio.onended = () => {
            if (currentSession === sessionId) setState("idle", "Tap me to start");
          };
          activeAudio.play().catch(() => {
            if (currentSession === sessionId) setState("idle", "Tap me to start");
          });
        } else {
          browserSpeak(payload.answer || "");
          window.setTimeout(() => {
            if (currentSession === sessionId) setState("idle", "Tap me to start");
          }, 3000);
        }
      }

      async function submitRecording(currentSession, sampleRate) {
        if (!apiUrl) {
          setState("error", "Voice unavailable");
          return;
        }
        const samples = flattenChunks();
        if (!samples.length) {
          setState("idle", "Tap me to start");
          return;
        }
        setState("thinking", "Thinking");
        const resampled = resampleLinear(samples, sampleRate, 16000);
        const wavBlob = encodeWav(resampled, 16000);
        const audioBase64 = await blobToBase64(wavBlob);
        if (currentSession !== sessionId) return;

        setState("gathering", "Gathering evidence");
        abortController = new AbortController();
        stageTimer = window.setTimeout(() => {
          if (currentSession === sessionId && state === "gathering") {
            setState("gathering", "Gathering evidence");
          }
        }, 500);
        try {
          const response = await requestJson(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal: abortController.signal,
            body: JSON.stringify({
              audio_base64: audioBase64,
              mime_type: "audio/wav",
              mode: answerMode,
              limit: 5,
            }),
          });
          const payload = await response.json();
          if (currentSession !== sessionId) return;
          if (!response.ok) {
            throw new Error(payload.error || `Voice request failed with HTTP ${response.status}`);
          }
          playAnswer(payload, currentSession);
        } finally {
          if (currentSession === sessionId) {
            clearStageTimer();
            abortController = null;
          }
        }
      }

      async function startRecording(currentSession) {
        chunks = [];
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        if (currentSession !== sessionId) {
          stream.getTracks().forEach((track) => track.stop());
          return;
        }
        audioContext = new AudioContext();
        source = audioContext.createMediaStreamSource(stream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = (event) => {
          if (!recording) return;
          chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
        };
        source.connect(processor);
        processor.connect(audioContext.destination);
        recording = true;
        setState("listening", "Listening...");
      }

      async function stopRecording() {
        const currentSession = sessionId;
        const stoppedAudioContext = audioContext;
        const sampleRate = stoppedAudioContext?.sampleRate || 48000;
        audioContext = null;
        recording = false;
        stopRecordingHardware();
        try {
          await submitRecording(currentSession, sampleRate);
        } catch (error) {
          if (currentSession === sessionId && error.name !== "AbortError") {
            setState("error", "Try again");
          }
        } finally {
          stoppedAudioContext?.close();
        }
      }

      function beginNewListeningSession() {
        resetCurrentSession();
        const currentSession = sessionId;
        setState("thinking", "Starting");
        startRecording(currentSession).catch(() => {
          if (currentSession === sessionId) setState("error", "Mic unavailable");
        });
      }

      orb.addEventListener("click", () => {
        if (state === "listening") {
          stopRecording().catch(() => setState("error", "Try again"));
          return;
        }
        beginNewListeningSession();
      });

      if (statusUrl) {
        requestJson(statusUrl)
          .then((response) => response.json())
          .then((payload) => {
            if (!payload.enabled) {
              setState("error", "Voice unavailable");
              return;
            }
          })
          .catch(() => {});
      }
    })();
    </script>

  </body>
</html>
