<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thesis Review — ICU Wiki</title>
    <meta name="description" content="Minimal side-by-side PDF comparison for ICU Wiki thesis versions." />
    <link rel="stylesheet" href="/icu-wiki/assets/site.css" />
  </head>
  <body class="review-fullscreen-page">
    <main class="review-app" data-review-root data-source="/icu-wiki/papers/paperVersions.json">
      <header class="review-topbar" aria-label="Thesis PDF selectors">
        <label>
          <span>Left</span>
          <select data-version-select="left"></select>
        </label>
        <label>
          <span>Right</span>
          <select data-version-select="right"></select>
        </label>
      </header>

      <section class="review-panes" aria-label="Side-by-side PDF comparison">
        <article class="review-pane" data-side="left">
          <iframe data-pdf-frame title="Left PDF"></iframe>
        </article>
        <article class="review-pane" data-side="right">
          <iframe data-pdf-frame title="Right PDF"></iframe>
        </article>
      </section>
    </main>
    <script type="module" src="/icu-wiki/assets/review.js?v=20260529b"></script>
  </body>
</html>
